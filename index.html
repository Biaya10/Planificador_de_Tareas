<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body class="bg-light">

    <header class="bg-primary text-white py-3 mb-4">
        <div class="container">
            <h1 class="h3 mb-0">Mi Planificador de Tareas</h1>
        </div>
    </header>

    <main class="container">

        <section id="task-form-section" class="card shadow-sm mb-4">
            <div class="card-body">
                <h2 class="h5 mb-3">Agregar nueva tarea</h2>

                <form id="task-form" class="row g-3">
                    <div class="col-md-6">
                        <label for="task-name" class="form-label">Nombre</label>
                        <input type="text" id="task-name" class="form-control" placeholder="Ej: Estudiar para el parcial" required>
                    </div>

                    <div class="col-md-6">
                        <label for="task-assignee" class="form-label">Asignado a</label>
                        <input type="text" id="task-assignee" class="form-control" placeholder="Nombre del responsable" required>
                    </div>

                    <div class="col-12">
                        <label for="task-description" class="form-label">Descripción</label>
                        <textarea id="task-description" class="form-control" rows="3" placeholder="Detalles de la tarea" required></textarea>
                    </div>

                    <div class="col-md-6">
                        <label for="task-due-date" class="form-label">Fecha de entrega</label>
                        <input type="date" id="task-due-date" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label for="task-status" class="form-label">Estado</label>
                        <select id="task-status" class="form-select" required>
                            <option value="todo">Pendiente</option>
                            <option value="inprogress">En proceso</option>
                            <option value="done">Terminado</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Añadir tarea</button>
                    </div>
                </form>
            </div>
        </section>

        <section id="task-board" class="row g-3">

            <div class="col-md-4" id="todo-column">
                <div class="card h-100">
                    <div class="card-header bg-secondary text-white">Pendiente</div>
                    <ul id="todo-list" class="list-group list-group-flush"></ul>
                </div>
            </div>

            <div class="col-md-4" id="inprogress-column">
                <div class="card h-100">
                    <div class="card-header bg-warning">En proceso</div>
                    <ul id="inprogress-list" class="list-group list-group-flush"></ul>
                </div>
            </div>

            <div class="col-md-4" id="done-column">
                <div class="card h-100">
                    <div class="card-header bg-success text-white">Terminado</div>
                    <ul id="done-list" class="list-group list-group-flush"></ul>
                </div>
            </div>

        </section>

    </main>

    <footer class="text-center text-muted py-4 mt-4">
        <p class="mb-0">&copy; 2026 Planificador de Tareas</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
</html>
